name: xhandler_mobile
description: "Create, sign and send SUNAT electronic documents."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.14.0

dependencies:
  flutter:
    sdk: flutter
  material_ui: ^1.1.0

  xhandler_bridge:
    path: rust_builder
  flutter_rust_bridge: 2.13.0
  flutter_riverpod: ^3.5.0
  go_router: ^18.1.4
  drift: ^2.35.4
  sqlite3: ^3.9.1
  flutter_secure_storage: ^11.2.0
  file_picker: ^13.3.3
  uuid: ^4.6.0
  path_provider: ^2.1.6
  http: ^1.6.0
  crypto: ^3.0.8
  workmanager: ^0.10.10
  flutter_local_notifications: ^23.0.2
  pdf: ^3.13.1
  share_plus: ^13.3.1
  mailer: ^7.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  integration_test:
    sdk: flutter
  drift_dev: ^2.35.3
  build_runner: ^2.17.1

flutter:

  uses-material-design: true
  assets:
    - assets/demo/
    - assets/fonts/OpenSans-Regular.ttf
    - assets/fonts/OpenSans-Bold.ttf


hooks:
  user_defines:
    sqlite3:
      # SQLite3MultipleCiphers: the database is encrypted (PRAGMA key)
      source: sqlite3mc
