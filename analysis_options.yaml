include: package:flutter_lints/flutter.yaml

analyzer:
  exclude:
    - build/**
    - rust/**
    - rust_builder/**
    - lib/src/rust/**
    - test/data/generated/**
    - android/**
    - ios/**
  language:
    strict-casts: true
    strict-inference: true
    strict-raw-types: true
  errors:
    use_build_context_synchronously: error

linter:
  rules:
    - always_declare_return_types
    - avoid_dynamic_calls
    - cancel_subscriptions
    - close_sinks
    - directives_ordering
    - discarded_futures
    - prefer_const_constructors
    - prefer_const_declarations
    - prefer_final_locals
    - unawaited_futures
