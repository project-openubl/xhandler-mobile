[package]
name = "xhandler_bridge"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
publish = false

[lib]
crate-type = ["cdylib", "staticlib", "rlib"]

[dependencies]
flutter_rust_bridge = { version = "=2.13.0", features = ["chrono"] }
xhandler = { git = "https://github.com/project-openubl/xhandler-rust", rev = "ad310c463adea6bb34f162d16ec407e71750a131" }
anyhow = "1.0"
base64 = "0.22"
chrono = "0.4"
serde_json = "1"
x509-cert = "0.3"

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(frb_expand)'] }
