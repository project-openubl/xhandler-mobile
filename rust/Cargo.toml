[package]
name = "xhandler_bridge"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
publish = false

[lib]
crate-type = ["cdylib", "staticlib", "rlib"]

[dependencies]
flutter_rust_bridge = "=2.13.0"
xhandler = { git = "https://github.com/project-openubl/xhandler-rust", rev = "8136f67e2d13a9c66c6986e228d6bf1c5c73997f" }
anyhow = "1.0"
base64 = "0.22"
chrono = "0.4"
rust_decimal = "1.36"
serde_json = "1"
x509-cert = "0.3"

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(frb_expand)'] }
