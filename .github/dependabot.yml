version: 2

# Dependabot PRs are auto-approved and auto-merged once CI passes
# (.github/workflows/auto-merge-dependabot.yaml), so the cooldown keeps freshly published
# (possibly compromised) releases out; security updates skip it.
# Groups take minor/patch only, so a breaking major arrives as its own PR.
# flutter_rust_bridge is pinned to the same version in pubspec.yaml, rust/Cargo.toml and the
# codegen CI installs: it is upgraded by hand, in all three at once.
updates:

  # Maintain dependencies for GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    commit-message:
      prefix: "chore"
      include: "scope"
    groups:
      github-actions:
        update-types: ["minor", "patch"]

  # Maintain dependencies for pubspec.yaml
  - package-ecosystem: "pub"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
      semver-major-days: 14
    commit-message:
      prefix: "chore"
      include: "scope"
    ignore:
      - dependency-name: "flutter_rust_bridge"
    groups:
      pub:
        update-types: ["minor", "patch"]

  # Maintain dependencies for rust/Cargo.toml
  - package-ecosystem: "cargo"
    directory: "/rust"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
      semver-major-days: 14
    commit-message:
      prefix: "chore"
      include: "scope"
    ignore:
      - dependency-name: "flutter_rust_bridge"
    groups:
      cargo:
        update-types: ["minor", "patch"]
