name: CI

on:
  push:
    branches: [main]
  pull_request: {}

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: "3.50.0"
  # Debug info makes the Rust libraries of every ABI huge
  CARGO_PROFILE_DEV_DEBUG: "0"

jobs:
  rust:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rust
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: Swatinem/rust-cache@v2.9.3
        with:
          workspaces: rust
      # Same toolchain as xhandler-rust, so new lints don't break the build
      - run: rustup toolchain install 1.100.0 --profile minimal --component rustfmt,clippy && rustup default 1.100.0
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test

  flutter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - uses: Swatinem/rust-cache@v2.9.3
        with:
          workspaces: rust
      - run: flutter pub get
      # The Dart bindings must match rust/src/api
      - run: cargo install flutter_rust_bridge_codegen --version 2.13.0 --locked
      - run: flutter_rust_bridge_codegen generate && git diff --exit-code
      - run: dart format --output=none --set-exit-if-changed $(find lib test integration_test -name '*.dart' -not -path 'lib/src/rust/*' -not -name '*.g.dart')
      - run: flutter analyze
      - run: flutter test

  android:
    runs-on: ubuntu-latest
    # A runner out of memory or disk hangs instead of failing
    timeout-minutes: 45
    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/node_modules /opt/ghc /usr/local/share/boost /usr/local/.ghcup \
            /opt/hostedtoolcache/CodeQL /usr/local/share/powershell /usr/share/swift /opt/microsoft /opt/google/chrome
          sudo docker image prune --all --force > /dev/null
          df -h /
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      # The project lets Gradle take 8 GB; next to the emulator that runs the
      # runner out of memory. User properties take precedence.
      - name: Limit Gradle memory
        run: |
          mkdir -p ~/.gradle
          printf 'org.gradle.jvmargs=-Xmx3g -XX:MaxMetaspaceSize=1g\norg.gradle.daemon=false\n' > ~/.gradle/gradle.properties
      # The emulator below is x86_64
      - run: flutter build apk --debug --target-platform android-x64
      # Runs the integration tests (Rust bridge included) on an emulator
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          ram-size: 2048M
          # The default 6 GB data partition didn't fit on the runner's disk
          disk-size: 3000M
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot
          # On failure, the device log says why the app stopped
          script: flutter test integration_test --reporter expanded || { adb logcat -d -t 500 '*:W' | tail -200; exit 1; }

  ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter build ios --simulator --debug
