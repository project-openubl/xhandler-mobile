# Builds the signed app of a release tag and uploads it to the stores (docs/STORE.md, Release
# CI). Releases are made with release-tools' release-mobile, which tags, publishes the GitHub
# release and waits for this workflow:
#
# - vX.Y.Z-alpha.N, -beta.N, -rc.N: Google Play internal testing and TestFlight.
# - vX.Y.Z: Google Play production as a staged rollout, and TestFlight plus a submission for
#   App Store review (released by hand once approved).
#
# The version and build number come from the tag (tool/release_version.sh). A store build that
# exists is skipped, so running it again for a tag is safe: to retry a failed release, dispatch
# it from main with the tag (a re-run would use the workflow file of the tagged commit).
name: Release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag, e.g. v1.1.0-alpha.1"
        required: true
        type: string

run-name: Release ${{ inputs.tag || github.event.release.tag_name }}

concurrency:
  group: release-${{ inputs.tag || github.event.release.tag_name }}

permissions:
  contents: read

env:
  FLUTTER_VERSION: "3.50.0"
  RUBY_VERSION: "3.4"
  TAG: ${{ inputs.tag || github.event.release.tag_name }}

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      name: ${{ steps.version.outputs.name }}
      ios_name: ${{ steps.version.outputs.ios_name }}
      code: ${{ steps.version.outputs.code }}
      prerelease: ${{ steps.version.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: refs/tags/${{ env.TAG }}
      - id: version
        run: tool/release_version.sh "$TAG" | tee -a "$GITHUB_OUTPUT"

  android:
    needs: version
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      # Attaches the APK and AAB to the GitHub release
      contents: write
    env:
      NAME: ${{ needs.version.outputs.name }}
      CODE: ${{ needs.version.outputs.code }}
      PRERELEASE: ${{ needs.version.outputs.prerelease }}
    steps:
      - name: Check secrets
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          missing=""
          for name in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD PLAY_SERVICE_ACCOUNT_JSON; do
            [ -n "${!name}" ] || missing="$missing $name"
          done
          if [ -n "$missing" ]; then
            echo "::error::Missing secrets for:$missing (docs/STORE.md, Release CI)"
            exit 1
          fi
      - name: Free disk space
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/node_modules /opt/ghc /usr/local/share/boost /usr/local/.ghcup
      - uses: actions/checkout@v7.0.1
        with:
          ref: refs/tags/${{ env.TAG }}
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ env.RUBY_VERSION }}
          bundler-cache: true
      - name: Signing key
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          echo "$KEYSTORE" | base64 --decode > android/app/release.jks
          printf 'storeFile=release.jks\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' \
            "$STORE_PASSWORD" "$KEY_ALIAS" "$KEY_PASSWORD" > android/key.properties
      - run: flutter build appbundle --release --build-name="$NAME" --build-number="$CODE"
      # For installing from GitHub: one APK for every ABI
      - run: flutter build apk --release --build-name="$NAME" --build-number="$CODE"
      - name: Name the files
        run: |
          mkdir dist
          cp build/app/outputs/bundle/release/app-release.aab "dist/xhandler-$NAME.aab"
          cp build/app/outputs/flutter-apk/app-release.apk "dist/xhandler-$NAME.apk"
          (cd dist && sha256sum -- * > SHA256SUMS)
      - uses: actions/upload-artifact@v7
        with:
          name: android-release
          path: dist/
      - name: Upload to Google Play
        env:
          PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          PLAY_RELEASE_STATUS: ${{ vars.PLAY_RELEASE_STATUS }}
          PLAY_ROLLOUT: ${{ vars.PLAY_ROLLOUT || '0.1' }}
        run: >
          bundle exec fastlane android release
          aab:"$PWD/dist/xhandler-$NAME.aab"
          code:"$CODE"
          prerelease:"$PRERELEASE"
      # The files of the first run stay, like the build Google Play already has
      - name: Attach to the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$TAG" --json assets --jq '.assets[].name' | grep -qx SHA256SUMS; then
            echo "The release $TAG already has its files"
          else
            gh release upload "$TAG" dist/*
          fi

  ios:
    needs: version
    runs-on: macos-latest
    timeout-minutes: 60
    env:
      NAME: ${{ needs.version.outputs.ios_name }}
      CODE: ${{ needs.version.outputs.code }}
      PRERELEASE: ${{ needs.version.outputs.prerelease }}
    steps:
      - name: Check secrets
        env:
          IOS_DISTRIBUTION_P12_BASE64: ${{ secrets.IOS_DISTRIBUTION_P12_BASE64 }}
          IOS_DISTRIBUTION_P12_PASSWORD: ${{ secrets.IOS_DISTRIBUTION_P12_PASSWORD }}
          IOS_PROVISIONING_PROFILE_NAME: ${{ secrets.IOS_PROVISIONING_PROFILE_NAME }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPSTORE_API_KEY_ID: ${{ secrets.APPSTORE_API_KEY_ID }}
          APPSTORE_API_ISSUER_ID: ${{ secrets.APPSTORE_API_ISSUER_ID }}
          APPSTORE_API_PRIVATE_KEY: ${{ secrets.APPSTORE_API_PRIVATE_KEY }}
        run: |
          missing=""
          for name in IOS_DISTRIBUTION_P12_BASE64 IOS_DISTRIBUTION_P12_PASSWORD IOS_PROVISIONING_PROFILE_NAME APPLE_TEAM_ID APPSTORE_API_KEY_ID APPSTORE_API_ISSUER_ID APPSTORE_API_PRIVATE_KEY; do
            [ -n "${!name}" ] || missing="$missing $name"
          done
          if [ -n "$missing" ]; then
            echo "::error::Missing secrets for:$missing (docs/STORE.md, Release CI)"
            exit 1
          fi
      - uses: actions/checkout@v7.0.1
        with:
          ref: refs/tags/${{ env.TAG }}
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ env.RUBY_VERSION }}
          bundler-cache: true
      - uses: apple-actions/import-codesign-certs@v7
        with:
          p12-file-base64: ${{ secrets.IOS_DISTRIBUTION_P12_BASE64 }}
          p12-password: ${{ secrets.IOS_DISTRIBUTION_P12_PASSWORD }}
      - uses: apple-actions/download-provisioning-profiles@v7
        with:
          bundle-id: io.github.projectopenubl.xhandler
          profile-type: IOS_APP_STORE
          issuer-id: ${{ secrets.APPSTORE_API_ISSUER_ID }}
          api-key-id: ${{ secrets.APPSTORE_API_KEY_ID }}
          api-private-key: ${{ secrets.APPSTORE_API_PRIVATE_KEY }}
      # The project signs automatically for development; the release archive
      # uses the distribution certificate and profile instead
      - name: Release signing
        env:
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          PROFILE: ${{ secrets.IOS_PROVISIONING_PROFILE_NAME }}
        run: bundle exec ruby tool/ios_release_signing.rb "$TEAM_ID" "$PROFILE"
      - name: Export options
        env:
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          PROFILE: ${{ secrets.IOS_PROVISIONING_PROFILE_NAME }}
        run: |
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>teamID</key><string>$TEAM_ID</string>
            <key>signingStyle</key><string>manual</string>
            <key>provisioningProfiles</key>
            <dict>
              <key>io.github.projectopenubl.xhandler</key><string>$PROFILE</string>
            </dict>
          </dict>
          </plist>
          EOF
      # Apple only takes X.Y.Z as the version: the build number tells pre-releases apart
      - run: >
          flutter build ipa --release
          --build-name="$NAME"
          --build-number="$CODE"
          --export-options-plist="$RUNNER_TEMP/ExportOptions.plist"
      - uses: actions/upload-artifact@v7
        with:
          name: ios-release
          path: build/ios/ipa/*.ipa
      # Named after the Xcode product
      - id: ipa
        run: echo "path=$(ls "$PWD"/build/ios/ipa/*.ipa | head -1)" >> "$GITHUB_OUTPUT"
      - name: Upload to the App Store
        env:
          APPSTORE_API_KEY_ID: ${{ secrets.APPSTORE_API_KEY_ID }}
          APPSTORE_API_ISSUER_ID: ${{ secrets.APPSTORE_API_ISSUER_ID }}
          APPSTORE_API_PRIVATE_KEY: ${{ secrets.APPSTORE_API_PRIVATE_KEY }}
          IPA: ${{ steps.ipa.outputs.path }}
        run: >
          bundle exec fastlane ios release
          ipa:"$IPA"
          version:"$NAME"
          code:"$CODE"
          prerelease:"$PRERELEASE"
